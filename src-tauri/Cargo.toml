[package]
name = "vaulty-app"
description = "Vaulty — Tauri shell around vault-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# Tauri v2 builds the app as a library so mobile targets can link it.
name = "vaulty_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Tauri decides between the dev server and embedded assets on this feature, not
# on the cargo profile. `cargo tauri dev` builds with --no-default-features so
# the app loads from the Vite server; `cargo tauri build` leaves the default on
# so `frontendDist` is embedded.
#
# Without it every build — release included — points at http://localhost:5173
# and shows a blank window unless a dev server happens to be running.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
vault-core = { path = "../crates/vault-core" }
vault-platform = { path = "../crates/vault-platform" }
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true

[dev-dependencies]
# The `test` feature provides the mock runtime used by tests/ipc_boundary.rs.
tauri = { version = "2", features = ["test"] }
tempfile = "3.13"
serde_json.workspace = true
