[package]
name = "vault-core"
description = "Vaulty crypto core: vault file format, key handling, entry CRUD. No UI, no Tauri."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# This crate must build and test with no Tauri dependency. That boundary is what
# keeps the crypto reviewable (CLAUDE.md, Layout).
[dependencies]
argon2.workspace = true
chacha20poly1305.workspace = true
zeroize.workspace = true
secrecy.workspace = true
subtle.workspace = true
rand_core.workspace = true
rusqlite.workspace = true
uuid.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3.13"
# Integration tests reach past the public API on purpose, to tamper with the
# stored rows the way an attacker with the file would.
rusqlite.workspace = true
